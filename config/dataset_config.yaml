build_version: "2.0.0"
random_seed: 1337
splits:
  train: 0.8
  val: 0.1
  test: 0.1
active_datasets:
  - chatdoctor_healthcaremagic
  - chatdoctor_icliniq
  - medical_meadow_medqa
  - medqa_usmle
  - mtsamples
  - neiss
  - pmc_patients
  - symptom2disease
  - fedmml_ed_triage
  - kaggle_medical_triage
  - l3cube_code_mixed
  - meddialog_en
  - nhamcs_ed
augmentation:
  hinglish:
    enabled_for: ["mtsamples"]
    variants_per_seed: 1
    substitution_rate: 0.5
deduplication:
  strategy: "exact_match"
  priority_order: ["pmc_patients", "mtsamples"]
